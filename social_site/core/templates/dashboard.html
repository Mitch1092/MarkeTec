<!DOCTYPE html>
<html>
<body>

<h1>Admin Dashboard</h1>

<h2>Usuarios</h2>
{% for u in users %}
<p>{{ u.username }}</p>
{% endfor %}

<h2>Reportes</h2>
{% for r in reports %}
<p>{{ r.reported_user }} - {{ r.reason }}</p>
{% endfor %}

<h2>Posts</h2>
{% for p in posts %}
<p>{{ p.title }}</p>
{% endfor %}

</body>
</html>
